# Remotes are loaded cross-origin by the shell (ES module import from :3000),
# so every response must carry CORS headers.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Access-Control-Allow-Origin * always;

    # Content-hashed build output: the filename changes whenever the bytes do,
    # so it is safe — and necessary, for cold-start latency — to cache forever.
    location /assets/ {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The Module Federation entry points are NOT hashed: their URLs are fixed and
    # their contents change on every deploy. With no Cache-Control nginx sends
    # none, browsers fall back to heuristic freshness, and the shell keeps
    # importing a stale remoteEntry — pinning the whole remote to an old chunk
    # graph long after the container was rebuilt.
    location ~ ^/(remoteEntry\.js|mf-manifest\.json)$ {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
