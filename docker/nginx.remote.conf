# Remotes are loaded cross-origin by the shell (ES module import from :3000),
# so every response must carry CORS headers.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Access-Control-Allow-Origin * always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
